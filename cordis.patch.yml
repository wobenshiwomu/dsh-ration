# dsh-ration bundle patch：一行挂载。
# row name 必须等于包名——宿主按包名解析入口（@deepseek-ai/dsh-* 同款惯例）。
# 客户端半区由 package.json 的 dsh.client 声明自动加入 web 名单
# （served at /plugins/dsh-ration/client.js）。
# 可调参数（cap5h / capWeek / enforce / gate5h / gateWeek …）
# 在 profile 的用户层覆盖，或运行时用 /ration 命令调整。
- insert:
    - id: dsh-ration
      name: 'dsh-ration'
